
name: ML Training Pipeline

# TRIGGER: When does this workflow run?
on:
  push:
    branches:
      - kernelridge  # Only triggers on pushes to this specific branch

# JOBS: What tasks to execute
jobs:
  train-and-evaluate:
    # Run on GitHub's hosted Ubuntu runner (free for public repos)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python 3.10 on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install our project dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the Decision Tree model — output appears in Actions logs
      - name: Train and Evaluate Decision Tree Model
        run: python train.py

      # Step 5: Run the Kernel Ridge model — output appears in Actions logs
      - name: Train and Evaluate Kernel Ridge Model
        run: python train2.py