name: ML Training Pipeline

on:
  push:
    branches:
      - kernelridge
  workflow_dispatch:

jobs:
  train-decision-tree:
    name: Train Decision Tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run train.py
        run: python train.py

  train-kernel-ridge:
    name: Train Kernel Ridge
    runs-on: ubuntu-latest
    needs: train-decision-tree

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run train2.py
        run: python train2.py
